# Server and CLI tests on every push and pull request.
# Windows, because that's where Agentic OS runs today: worktree jobs use NTFS junctions and the
# restart scripts are PowerShell.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      # the tests make real git repos and compare file contents: keep LF and give git an identity
      - name: git setup
        run: |
          git config --global core.autocrlf false
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install
        run: bun install
      # the server shells out to ffmpeg (voice) and to the agentos CLI (modules)
      - name: ffmpeg
        run: choco install ffmpeg -y --no-progress
      - name: agentos CLI on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          bun build cli/src/agentos.ts --compile --outfile "$RUNNER_TEMP/bin/agentos.exe"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # the runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...), which git resolves differently
      - name: Server tests
        run: |
          $env:TEMP = $env:RUNNER_TEMP; $env:TMP = $env:RUNNER_TEMP
          bun test server
      - name: CLI tests
        working-directory: cli
        run: bun test src
